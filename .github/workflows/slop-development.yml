name: Sully development checks
on:
  push:
    branches: [slop/discovery-foundations]
    paths: ['tools/sully/**', '.github/workflows/slop-development.yml']
  pull_request:
    paths: ['tools/sully/**', '.github/workflows/slop-development.yml']
permissions:
  contents: read
concurrency:
  group: slop-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sully/slop-archive.test.cjs tools/sully/slop-personal.test.cjs tools/sully/genre-directory.test.cjs
      - run: |
          node --check tools/sully/app.js
          node --check tools/sully/personal-ui.js
          node --check tools/sully/design-ui.js
          node --check tools/sully/genre-directory.js
          node --check tools/sully/genre-ui.js
          node --check tools/sully/slop-slip-ui.js
          node --check tools/sully/embed.js
          node --check tools/sully/artwork-drawer.js
      - name: Browser recovery check
        run: |
          npm install --prefix "$RUNNER_TEMP/slop-check" --no-save playwright@1.64.0
          "$RUNNER_TEMP/slop-check/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/slop-server.log 2>&1 &
          SLOP_PLAYWRIGHT="$RUNNER_TEMP/slop-check/node_modules/playwright" node tools/sully/tests/library-browser.cjs
          SLOP_PLAYWRIGHT="$RUNNER_TEMP/slop-check/node_modules/playwright" node tools/sully/tests/genres-browser.cjs
          SLOP_PLAYWRIGHT="$RUNNER_TEMP/slop-check/node_modules/playwright" node tools/sully/tests/genre-layout-browser.cjs
          SLOP_TEST_URL="http://127.0.0.1:8766/tools/sully/" SLOP_PLAYWRIGHT="$RUNNER_TEMP/slop-check/node_modules/playwright" node tools/sully/tests/artwork-drawer-browser.cjs
  catalogue-sample:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/sully/scripts/build-catalogue.cjs "$RUNNER_TEMP/slop-catalogue.json"
      - uses: actions/upload-artifact@v4
        with:
          name: slop-metadata-sample
          path: ${{ runner.temp }}/slop-catalogue.json
          retention-days: 1
