        /* grid: rendered at build time; here we only wire the buttons */
        var gridButtons = $("music").querySelectorAll("button[data-slug]");
        for (var g = 0; g < gridButtons.length; g++) {
          gridButtons[g].addEventListener("click", function () { location.hash = this.getAttribute("data-slug"); });
        }

        /* album view */
        function showAlbum(a) {
          var view = $("album");
          if (!a) { view.hidden = true; markGrid(); return; }
          $("a-cover").src = coverOf(a); $("a-cover").alt = a.title;
          $("a-title").textContent = a.title;
          var d = new Date(a.date + "T00:00:00");
          $("a-sub").textContent = "a kind of likeness · " + d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
          $("a-about").textContent = a.about || ""; $("a-about").hidden = !a.about;
          $("f-tracks").textContent = a.tracks.length;
          $("f-time").textContent = hms(a.total_seconds);
          var rates = {}; a.tracks.forEach(function (t) { rates[t.bit_depth + "-bit / " + (t.sample_rate / 1000) + " kHz"] = 1; });
          $("f-format").textContent = Object.keys(rates).join(", ");
          var bytes = a.tracks.reduce(function (s, t) { return s + (t.flac_bytes || 0); }, 0);
          $("f-size").textContent = mb(bytes) + " FLAC";
          var get = $("a-get"); get.innerHTML = "";
          get.appendChild(el("a", { href: zipUrl(a), rel: "noopener noreferrer", html: "Download album <sub>FLAC + cover, zip, " + mb(bytes) + "</sub>" }));
          get.appendChild(el("a", { href: a.bandcamp, rel: "noopener noreferrer", html: "Bandcamp ↗ <sub>buy, or name your price</sub>" }));
          get.appendChild(el("a", { href: a.archive.details, rel: "noopener noreferrer", html: "archive.org ↗ <sub>item page, torrent, all formats</sub>" }));
          get.appendChild(el("a", { "class": "sums", href: a.archive.download + "/SHA256SUMS.txt", rel: "noopener noreferrer", html: "SHA256SUMS <sub>check your download</sub>" }));
          var tb = $("tracks").tBodies[0]; tb.innerHTML = "";
          a.tracks.forEach(function (t, i) {
            var play = el("button", { type: "button", text: t.title, "aria-label": "Play " + t.title });
            play.addEventListener("click", function () { playTrack(a, i); });
            var getc = el("td", { "class": "get" }, [el("a", { href: flacUrl(a, t), rel: "noopener noreferrer", text: "flac", title: mb(t.flac_bytes) })]);
            var tr = el("tr", { id: "tr-" + a.slug + "-" + i }, [
              el("td", { "class": "n", text: ("0" + (i + 1)).slice(-2) }),
              el("td", { "class": "t" }, [play]),
              el("td", { "class": "d", text: mmss(t.seconds) }),
              getc
            ]);
            tb.appendChild(tr);
          });
          learnFormats(a).then(function (have) {
            if (bySlug(location.hash.slice(1)) !== a) return;
            a.tracks.forEach(function (t, i) {
              var mp3 = t.flac.replace(/\.flac$/, ".mp3");
              if (!have[mp3]) return;
              var cell = $("tr-" + a.slug + "-" + i).querySelector(".get");
              cell.appendChild(el("a", { href: mp3Url(a, t), rel: "noopener noreferrer", text: "mp3" }));
            });
          });
          view.hidden = false;
          markGrid(); markTracks();
        }
        function markGrid() {
          var open = location.hash.slice(1);
          albums.forEach(function (a) {
            var r = $("rec-" + a.slug);
            r.classList.toggle("is-open", a.slug === open);
            r.classList.toggle("is-playing", state.album === a && !state.paused);
          });
        }
        function markTracks() {
          var rows = $("tracks").querySelectorAll("tr");
          for (var i = 0; i < rows.length; i++) {
            var on = state.album && rows[i].id === "tr-" + state.album.slug + "-" + state.track;
            rows[i].classList.toggle("is-playing", !!on);
            rows[i].classList.toggle("is-paused", !!on && state.paused);
          }
        }
        function route() {
          var a = bySlug(location.hash.slice(1));
          showAlbum(a);
          if (a && location.hash) { var v = $("album"); if (v.getBoundingClientRect().top < 0 || v.getBoundingClientRect().top > innerHeight * 0.6) v.scrollIntoView({ block: "start", behavior: "smooth" }); }
        }
        addEventListener("hashchange", route);

        /* player */
        var player = $("player");
        function setSource(a, t, preferFlac) {
          var have = state.formats[a.slug] || {};
          var mp3 = t.flac.replace(/\.flac$/, ".mp3");
          audio.src = (!preferFlac && have[mp3]) ? mp3Url(a, t) : flacUrl(a, t);
          audio.dataset.fallback = (!preferFlac && have[mp3]) ? flacUrl(a, t) : "";
        }
        function playTrack(a, i) {
          if (i < 0 || i >= a.tracks.length) return;
          var t = a.tracks[i];
          if (state.album === a && state.track === i) { toggle(); return; }
          state.album = a; state.track = i; state.paused = false;
          $("p-note").textContent = "";
          $("p-cover").src = coverOf(a);
          $("p-track").textContent = ("0" + (i + 1)).slice(-2) + "  " + t.title;
          $("p-album").textContent = a.title + " · " + a.year;
          $("p-dur").textContent = mmss(t.seconds); $("p-cur").textContent = "0:00"; $("p-bar").style.width = "0";
          player.classList.add("is-live");
          learnFormats(a).then(function () {
            if (state.album !== a || state.track !== i) return;
            setSource(a, t, false);
            var p = audio.play(); if (p && p.catch) p.catch(function () {});
          });
          markGrid(); markTracks();
        }
        function toggle() {
          if (!state.album) return;
          if (audio.paused) { var p = audio.play(); if (p && p.catch) p.catch(function () {}); } else audio.pause();
        }
        function step(d) { if (!state.album) return; var n = state.track + d; if (n >= 0 && n < state.album.tracks.length) playTrack(state.album, n); }
        audio.addEventListener("play", function () { state.paused = false; $("p-play").classList.add("is-playing"); markGrid(); markTracks(); });
        audio.addEventListener("pause", function () { state.paused = true; $("p-play").classList.remove("is-playing"); markGrid(); markTracks(); });
        audio.addEventListener("timeupdate", function () {
          var d = audio.duration || (state.album && state.album.tracks[state.track].seconds) || 0;
          $("p-cur").textContent = mmss(audio.currentTime);
          $("p-bar").style.width = d ? (100 * audio.currentTime / d) + "%" : "0";
        });
        audio.addEventListener("durationchange", function () { if (isFinite(audio.duration) && audio.duration) $("p-dur").textContent = mmss(audio.duration); });
        audio.addEventListener("ended", function () { step(1); });
        audio.addEventListener("error", function () {
          if (audio.dataset.fallback) { audio.src = audio.dataset.fallback; audio.dataset.fallback = ""; var p = audio.play(); if (p && p.catch) p.catch(function () {}); return; }
          $("p-note").textContent = "— can't reach archive.org from here; open the album there to listen.";
          state.paused = true; $("p-play").classList.remove("is-playing"); markGrid(); markTracks();
        });
        $("p-play").addEventListener("click", toggle);
        /* volume */
        var vol = $("p-vol"), mute = $("p-mute");
        try { var v = localStorage.getItem("akol-volume"); if (v !== null && isFinite(+v)) audio.volume = Math.min(1, Math.max(0, +v)); } catch (e) {}
        function paintVol() { vol.value = audio.muted ? 0 : audio.volume; mute.classList.toggle("is-muted", audio.muted || audio.volume === 0); }
        vol.addEventListener("input", function () { audio.volume = +vol.value; audio.muted = false; try { localStorage.setItem("akol-volume", vol.value); } catch (e) {} paintVol(); });
        mute.addEventListener("click", function () { audio.muted = !audio.muted; paintVol(); });
        audio.addEventListener("volumechange", paintVol);
        paintVol();
        $("p-prev").addEventListener("click", function () { if (audio.currentTime > 4) audio.currentTime = 0; else step(-1); });
        $("p-next").addEventListener("click", function () { step(1); });
        $("p-album").addEventListener("click", function () { if (state.album) location.hash = state.album.slug; });
        $("p-seek").addEventListener("click", function (e) {
          var d = audio.duration; if (!isFinite(d) || !d) return;
          var r = e.currentTarget.getBoundingClientRect(); audio.currentTime = d * (e.clientX - r.left) / r.width;
        });
        addEventListener("keydown", function (e) {
          if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
          if (e.code === "Space" && state.album) { e.preventDefault(); toggle(); }
        });

        route();
      })();
    </script>
  </body>
</html>
