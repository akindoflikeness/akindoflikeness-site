<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d">
  <title id="t">Transmutation</title>
  <desc id="d">The squared circle of alchemy: circle within square within triangle within circle, ringed by the seven folder sigils of the sample pack.</desc>
  <g fill="none" stroke="#c9953d" stroke-linejoin="round" stroke-linecap="round">
    <!-- dial ring -->
    <circle cx="200" cy="200" r="190" stroke-width="1" stroke-opacity=".45" stroke-dasharray="1 5.94"/>
    <!-- the great work: circle / triangle / square / circle -->
    <circle cx="200" cy="200" r="140" stroke-width="1.5"/>
    <path d="M200 60 L321.24 270 L78.76 270 Z" stroke-width="1.5"/>
    <rect x="143.75" y="157.5" width="112.5" height="112.5" stroke-width="1.5"/>
    <circle cx="200" cy="213.75" r="56.25" stroke-width="1.5"/>
    <!-- the stone -->
    <circle cx="200" cy="213.75" r="3" fill="#c9953d" stroke="none"/>
    <!-- seven sigils, one per folder, on the outer ring -->
    <g stroke-width="1.6">
      <!-- sulphur · ARP -->
      <g transform="translate(200 30)"><path d="M-5.5 -1 L0 -10 L5.5 -1 Z M0 -1 V9 M-4.5 4.5 H4.5"/></g>
      <!-- air · BASS -->
      <g transform="translate(332.9 94)"><path d="M-7.5 6 L0 -7 L7.5 6 Z M-4 1 H4"/></g>
      <!-- star · CHORD -->
      <g transform="translate(365.5 237.8)"><path d="M0 -8 V-3 M0 3 V8 M-8 0 H-3 M3 0 H8 M-5.7 -5.7 L-2.1 -2.1 M2.1 2.1 L5.7 5.7 M5.7 -5.7 L2.1 -2.1 M-2.1 2.1 L-5.7 5.7"/></g>
      <!-- fire · DRUM -->
      <g transform="translate(273.8 356.5)"><path d="M-7.5 6 L0 -7 L7.5 6 Z"/></g>
      <!-- earth · TEXTURE -->
      <g transform="translate(126.2 356.5)"><path d="M-7.5 -6 L7.5 -6 L0 7 Z M-4 -1 H4"/></g>
      <!-- water · PAD -->
      <g transform="translate(34.5 237.8)"><path d="M-7.5 -6 L7.5 -6 L0 7 Z"/></g>
      <!-- aqua fortis · GTR -->
      <g transform="translate(67.1 94)"><path d="M-7 -7 L7 -7 L0 4 Z M0 4 V9"/></g>
    </g>
  </g>
</svg>
