        <article class="music">
          <section class="latest" data-slug="{{latest_slug}}" style="--accent: {{latest_accent}}" aria-label="Latest release">
            <a class="latest-cover" href="{{latest_page}}">{{latest_cover}}</a>
            <div class="latest-word">
              <p class="eyebrow">latest</p>
              <h1 class="latest-title"><a href="{{latest_page}}">{{latest_title}}</a></h1>
              <p class="latest-sub">{{latest_sub}}</p>
{{latest_about}}
              <p class="act">
                {{latest_play}}
                <a class="act-link" href="{{latest_page}}">open the release</a>
              </p>
            </div>
          </section>
          <div class="records" aria-label="Earlier releases">
{{records}}
          </div>
        </article>
