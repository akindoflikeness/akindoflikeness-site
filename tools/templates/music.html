<section class="latest" data-slug="{{latest_slug}}" style="--accent: {{latest_accent}}" aria-label="Featured album">
  <a class="latest-cover" href="{{latest_page}}">{{latest_cover}}</a>
  <div class="latest-word">
    <h1 class="latest-title"><a href="{{latest_page}}">{{latest_title}}</a></h1>
    <p class="latest-sub">{{latest_sub}}</p>
    <p class="latest-about essay-prose">{{latest_about}}</p>
    <p class="act">{{latest_play}}<a class="act-link" href="{{latest_page}}">Open</a></p>
  </div>
</section>
