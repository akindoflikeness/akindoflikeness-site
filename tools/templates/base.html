<!doctype html>
<!-- Built by tools/build.py. Edit pages/, writeups/, catalogue.json or tools/templates/, then run: python3 tools/build.py -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>document.documentElement.className += " js"</script>
    <style>
      /* Self-contained: visible without the site stylesheet, font or images. */
      .veil { display:none; position:fixed; inset:0; z-index:9; background:var(--ground,#090909); color:var(--ink,#e5e5e5); transition:opacity .7s ease }
      .js .veil { display:grid; place-items:center }
      .veil.is-off { opacity:0; pointer-events:none }
      .veil-status { display:grid; justify-items:center; gap:18px; font:12px/1.5 monospace; letter-spacing:.12em }
      .veil-pulse { width:6px; height:6px; margin:0 24px; background:currentColor; box-shadow:-18px 0 currentColor,18px 0 currentColor; animation:veil-pulse 1.2s steps(3,end) infinite }
      @keyframes veil-pulse { 0%,100% { opacity:.3 } 50% { opacity:1 } }
      @media (prefers-reduced-motion:reduce) { .veil-pulse { animation:none } .veil { transition:none } }
    </style>
    <title>{{title}}</title>
    <meta name="theme-color" content="{{theme_color}}">
{{head_extra}}
    <link rel="preload" href="{{root}}assets/fonts/Likeness-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link id="site-style" rel="stylesheet" href="{{root}}assets/nzbt-offering.css" media="print" onload="this.media='all';this.dataset.ready='1'" onerror="this.dataset.ready='1'">
    <noscript><link rel="stylesheet" href="{{root}}assets/nzbt-offering.css"></noscript>
    <link rel="icon" href="{{root}}favicon.ico" sizes="16x16 32x32 48x48 64x64">
  </head>
  <body{{body_attrs}}>
    <div class="veil" id="veil">
      <div class="veil-status" role="status"><span class="veil-pulse" aria-hidden="true"></span><span>loading</span></div>
    </div>
    <a class="skip" href="#main">Skip to content</a>
    <span class="sr-only" id="page-status" role="status"></span>
    <div class="layout">
      <header class="sidebar">
        <div class="identity">
          <a href="{{home}}"{{cur_home}}>AKOL</a>
        </div>
        <nav class="nav" aria-label="Pages">
          <a href="{{root}}music.html"{{cur_music}}>Music</a>
          <a href="{{root}}tools.html"{{cur_bypo}}>Tools</a>
          <a href="{{root}}samples.html"{{cur_pack}}>Samples</a>
          <a href="{{root}}writing.html"{{cur_writing}}>Writing</a>
        </nav>
        <div class="elsewhere">
          <a href="https://akindoflikeness.bandcamp.com">bandcamp</a>
          <a href="https://www.youtube.com/@akindoflikeness">youtube</a>
          <a href="https://github.com/wraithsys">github</a>
          <a href="https://discord.gg/xBtGXU7Etf">discord</a>
          <button class="contact" id="copy-email" type="button">email</button>
          <span class="contact-status fine" id="copy-email-status" role="status"></span>
        </div>
      </header>
      <main class="content" id="main" tabindex="-1">
{{content}}
      </main>
    </div>
{{tail}}
    <script src="{{root}}music-feature.js" defer></script>
    <script src="{{root}}tools-browser.js" defer></script>
    <script src="{{root}}assets/nzbt-listening.js" defer></script>
    <script src="{{root}}assets/vendor/swup.umd.js" defer></script>
    <script src="{{root}}site-navigation.js" defer></script>
    <script>
    (function () {
      var button = document.getElementById("copy-email");
      var status = document.getElementById("copy-email-status");
      var timer;
      button.addEventListener("click", async function () {
        try {
          await navigator.clipboard.writeText("akindoflikeness@gmail.com");
          status.textContent = "copied";
          clearTimeout(timer);
          timer = setTimeout(function () { status.textContent = ""; }, 2500);
        } catch (error) {
          status.textContent = "Copy manually: akindoflikeness@gmail.com";
        }
      });
    })();
    /* Reveal when styles and type are ready. Remote images must not block the page. */
    (function () {
      var veil = document.getElementById("veil"); if (!veil) return;
      if (!window.Promise) { veil.parentNode.removeChild(veil); return; }
      var MAX = 1000, FADE = 700, waits = [];
      var sheet = document.getElementById("site-style");
      var styled = new Promise(function (done) {
        if (sheet.dataset.ready) return done();
        sheet.addEventListener("load", done, { once:true });
        sheet.addEventListener("error", done, { once:true });
      });
      waits.push(styled.then(function () {
        if (document.fonts && document.fonts.load) return document.fonts.load('1em "Likeness"').catch(function () {});
      }));
      function lift() {
        if (!veil.parentNode || veil.className.indexOf("is-off") >= 0) return;
        veil.className += " is-off";
        veil.setAttribute("aria-hidden", "true");
        function gone() { if (veil.parentNode) veil.parentNode.removeChild(veil); }
        veil.addEventListener("transitionend", gone);
        setTimeout(gone, FADE + 100);
      }
      Promise.all(waits).then(lift, lift);
      setTimeout(lift, MAX);
    })();
    </script>
  </body>
</html>
